<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON SNAKE</title>

<style>
:root{
    --neon:#39ff88;
    --neon2:#00d9ff;
    --bg:#05080c;
    --panel:rgba(15,22,28,.72);
    --border:rgba(57,255,136,.25);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    touch-action:none;
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-2;
    background:
        radial-gradient(circle at 50% 20%, rgba(57,255,136,.08), transparent 40%),
        #05080c;
}

.grid{
    position:absolute;
    inset:-50%;
    background-image:
        linear-gradient(rgba(57,255,136,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57,255,136,.07) 1px, transparent 1px);
    background-size:45px 45px;
    transform:perspective(500px) rotateX(60deg);
    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
    from{background-position:0 0;}
    to{background-position:0 45px;}
}

.particle-bg{
    position:absolute;
    width:4px;
    height:4px;
    background:var(--neon);
    border-radius:50%;
    opacity:.3;
    box-shadow:0 0 12px var(--neon);
    animation:float 8s linear infinite;
}

@keyframes float{
    from{transform:translateY(110vh);}
    to{transform:translateY(-20vh);}
}

/* APP */

.game-app{
    width:min(100%,520px);
    height:100vh;
    max-height:950px;

    display:flex;
    flex-direction:column;

    padding:12px;

    position:relative;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:10px;
}

.logo{
    font-weight:900;
    letter-spacing:3px;
    font-size:22px;
    color:var(--neon);

    text-shadow:
        0 0 8px var(--neon),
        0 0 20px var(--neon);
}

.fps{
    font-size:11px;
    opacity:.6;
}

/* GLASS */

.glass{
    background:var(--panel);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    border:1px solid var(--border);

    box-shadow:
        0 10px 35px rgba(0,0,0,.35),
        inset 0 0 20px rgba(57,255,136,.03);

    border-radius:18px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-bottom:10px;
}

.stat{
    padding:10px 4px;
    text-align:center;
}

.stat-label{
    font-size:9px;
    opacity:.55;
    letter-spacing:1px;
}

.stat-value{
    margin-top:4px;
    color:var(--neon);
    font-weight:bold;
    font-size:17px;
    text-shadow:0 0 8px rgba(57,255,136,.7);
}

/* BUTTON */

.icon-btn{
    border:none;
    color:var(--neon);
    background:rgba(57,255,136,.08);

    border:1px solid var(--border);

    border-radius:10px;

    padding:8px 10px;

    cursor:pointer;

    transition:.2s;

    box-shadow:0 0 12px rgba(57,255,136,.1);
}

.icon-btn:active{
    transform:scale(.9);
}

.icon-btn:hover{
    background:rgba(57,255,136,.18);
}

/* GAME AREA */

.game-wrapper{
    position:relative;

    flex:1;

    min-height:0;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:20px;
}

#gameCanvas{
    width:100%;
    height:100%;

    border-radius:20px;

    border:1px solid var(--border);

    background:
        radial-gradient(circle at center,
        rgba(57,255,136,.05),
        transparent 60%);

    box-shadow:
        inset 0 0 40px rgba(57,255,136,.05),
        0 0 30px rgba(57,255,136,.06);
}

/* OVERLAY */

.overlay{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(6px);

    opacity:0;
    pointer-events:none;

    transition:.35s;

    border-radius:20px;
}

.overlay.show{
    opacity:1;
    pointer-events:auto;
}

.overlay-box{
    width:min(85%,340px);

    padding:28px;

    text-align:center;

    transform:scale(.8);
    transition:.35s;
}

.overlay.show .overlay-box{
    transform:scale(1);
}

.overlay h1{
    margin:0 0 10px;

    color:var(--neon);

    font-size:28px;

    letter-spacing:3px;

    text-shadow:0 0 15px var(--neon);
}

.overlay p{
    opacity:.7;
}

.big-score{
    font-size:42px;
    color:white;
    font-weight:bold;
    margin:12px 0;
}

.neon-btn{
    width:100%;

    padding:13px;

    border:none;

    border-radius:14px;

    background:var(--neon);
    color:#04120a;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

    box-shadow:
        0 0 15px var(--neon),
        0 0 35px rgba(57,255,136,.4);
}

.neon-btn:active{
    transform:scale(.95);
}

/* COUNTDOWN */

.countdown{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:70px;

    font-weight:900;

    color:var(--neon);

    text-shadow:
        0 0 20px var(--neon),
        0 0 50px var(--neon);

    pointer-events:none;

    opacity:0;

    transition:.25s;
}

.countdown.show{
    opacity:1;
}

/* CONTROLS */

.controls{
    margin-top:12px;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    grid-template-areas:
    ". up ."
    "left down right";

    gap:8px;

    max-width:320px;

    width:100%;

    align-self:center;
}

.control-btn{
    height:52px;

    border:none;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(57,255,136,.15),
            rgba(0,0,0,.2)
        );

    border:1px solid var(--border);

    color:var(--neon);

    font-size:23px;

    cursor:pointer;

    transition:
        transform .1s,
        background .2s;

    box-shadow:
        0 0 12px rgba(57,255,136,.12),
        inset 0 0 15px rgba(57,255,136,.05);
}

.control-btn:active{
    transform:scale(.88);

    background:rgba(57,255,136,.3);

    box-shadow:
        0 0 20px var(--neon);
}

.up{grid-area:up;}
.left{grid-area:left;}
.right{grid-area:right;}
.down{grid-area:down;}

/* BOTTOM BAR */

.bottom-bar{
    display:flex;

    justify-content:space-between;

    margin-top:8px;

    font-size:10px;

    opacity:.5;
}

/* SETTINGS */

.settings-btn{
    position:absolute;

    top:14px;
    right:14px;

    z-index:10;
}

.settings{
    position:absolute;

    top:58px;
    right:12px;

    width:220px;

    padding:16px;

    z-index:20;

    display:none;
}

.settings.show{
    display:block;

    animation:menuIn .25s ease;
}

@keyframes menuIn{
    from{
        opacity:0;
        transform:translateY(-10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.settings h3{
    margin-top:0;

    color:var(--neon);
}

.settings label{
    display:block;

    margin-top:12px;

    font-size:12px;

    opacity:.8;
}

.settings select,
.settings input{
    width:100%;

    margin-top:6px;

    padding:9px;

    background:#07110c;

    color:var(--neon);

    border:1px solid var(--border);

    border-radius:9px;
}

/* DESKTOP */

@media(min-width:700px){

    .game-app{
        height:95vh;
    }

    .controls{
        max-width:280px;
    }

}

@media(max-height:650px){

    .control-btn{
        height:42px;
    }

    .stats{
        margin-bottom:5px;
    }

    .stat{
        padding:6px;
    }

}
</style>

</head>

<script>

/* =========================
   DOM
========================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const scoreEl =
    document.getElementById("score");

const bestEl =
    document.getElementById("best");

const speedEl =
    document.getElementById("speed");

const fpsEl =
    document.getElementById("fps");

const gameOverEl =
    document.getElementById("gameOver");

const finalScoreEl =
    document.getElementById("finalScore");

const restartBtn =
    document.getElementById("restartBtn");

const pauseBtn =
    document.getElementById("pauseBtn");

const countdownEl =
    document.getElementById("countdown");

const settingsBtn =
    document.getElementById("settingsBtn");

const settings =
    document.getElementById("settings");

const difficultyEl =
    document.getElementById("difficulty");

const speedSetting =
    document.getElementById("speedSetting");


/* =========================
   GAME VARIABLES
========================= */

let gridSize = 20;

let snake = [];

let food = {};

let particles = [];

let direction = {x:1,y:0};

let nextDirection = {x:1,y:0};

let score = 0;

let bestScore =
    Number(
        localStorage.getItem("neonSnakeBest")
    ) || 0;

let running = false;

let paused = false;

let gameOver = false;

let lastTime = 0;

let accumulator = 0;

let currentSpeed = 7;

let baseSpeed = 7;

let fps = 60;

let fpsFrames = 0;

let fpsTime = 0;


/* =========================
   DIFFICULTY
========================= */

const difficulties = {

    easy:5,

    normal:7,

    hard:10

};


/* =========================
   CANVAS RESIZE
========================= */

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================
   AUDIO API
========================= */

let audioContext = null;

function initAudio(){

    if(!audioContext){

        audioContext =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

}


function beep(
    frequency,
    duration,
    type="sine",
    volume=.05
){

    try{

        initAudio();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.frequency.value =
            frequency;

        oscillator.type =
            type;

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }

    catch(e){}

}


function eatSound(){

    beep(
        600,
        .08,
        "square",
        .06
    );

    setTimeout(()=>{

        beep(
            850,
            .06,
            "square",
            .04
        );

    },50);

}


function clickSound(){

    beep(
        300,
        .04,
        "sine",
        .04
    );

}


function gameOverSound(){

    beep(
        200,
        .3,
        "sawtooth",
        .07
    );

}


/* =========================
   VIBRATION
========================= */

function vibrate(ms=20){

    if(
        navigator.vibrate
    ){

        navigator.vibrate(ms);

    }

}


/* =========================
   START GAME
========================= */

function resetGame(){

    score = 0;

    currentSpeed =
        baseSpeed;

    direction =
        {x:1,y:0};

    nextDirection =
        {x:1,y:0};


    const cols =
        Math.floor(
            canvas.clientWidth /
            gridSize
        );

    const rows =
        Math.floor(
            canvas.clientHeight /
            gridSize
        );


    const startX =
        Math.floor(cols/2);

    const startY =
        Math.floor(rows/2);


    snake = [

        {x:startX,y:startY},

        {x:startX-1,y:startY},

        {x:startX-2,y:startY}

    ];


    particles = [];

    spawnFood();

    gameOver = false;

    paused = false;

    running = false;

    gameOverEl.classList.remove("show");

    updateUI();

    startCountdown();

}


/* =========================
   COUNTDOWN
========================= */

function startCountdown(){

    const sequence =
        ["3","2","1","GO!"];

    let index = 0;

    countdownEl.classList.add("show");


    function next(){

        if(
            index >= sequence.length
        ){

            countdownEl.classList.remove("show");

            running = true;

            lastTime =
                performance.now();

            requestAnimationFrame(gameLoop);

            return;

        }


        countdownEl.textContent =
            sequence[index];

        index++;

        setTimeout(
            next,
            700
        );

    }


    next();

}


/* =========================
   FOOD
========================= */

function spawnFood(){

    const cols =
        Math.floor(
            canvas.clientWidth /
            gridSize
        );

    const rows =
        Math.floor(
            canvas.clientHeight /
            gridSize
        );

    let valid = false;


    while(!valid){

        food = {

            x:
                Math.floor(
                    Math.random()*cols
                ),

            y:
                Math.floor(
                    Math.random()*rows
                ),

            spawnTime:
                performance.now()

        };


        valid =
            !snake.some(
                s=>
                s.x===food.x &&
                s.y===food.y
            );

    }

}


/* =========================
   PARTICLES
========================= */

function createParticles(x,y){

    for(let i=0;i<18;i++){

        particles.push({

            x:
                x*gridSize +
                gridSize/2,

            y:
                y*gridSize +
                gridSize/2,

            vx:
                (Math.random()-.5)*5,

            vy:
                (Math.random()-.5)*5,

            life:1,

            size:
                Math.random()*4+2

        });

    }

}


function updateParticles(){

    particles.forEach(p=>{

        p.x += p.vx;

        p.y += p.vy;

        p.vx *= .95;

        p.vy *= .95;

        p.life -= .035;

    });


    particles =
        particles.filter(
            p=>p.life>0
        );

}


function drawParticles(){

    particles.forEach(p=>{

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            "#39ff88";

        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            "#39ff88";

        ctx.fillRect(

            p.x,
            p.y,

            p.size,
            p.size

        );

    });

    ctx.globalAlpha = 1;

    ctx.shadowBlur = 0;

}


/* =========================
   INPUT
========================= */

function setDirection(dir){

    if(!running || paused)
        return;


    const dirs = {

        up:
            {x:0,y:-1},

        down:
            {x:0,y:1},

        left:
            {x:-1,y:0},

        right:
            {x:1,y:0}

    };


    const newDir =
        dirs[dir];


    if(!newDir)
        return;


    if(

        newDir.x ===
        -direction.x

        &&

        newDir.y ===
        -direction.y

    )
        return;


    nextDirection =
        newDir;

    clickSound();

    vibrate(10);

}


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
    "keydown",
    e=>{

        const key =
            e.key.toLowerCase();


        const map = {

            arrowup:"up",

            w:"up",

            arrowdown:"down",

            s:"down",

            arrowleft:"left",

            a:"left",

            arrowright:"right",

            d:"right"

        };


        if(map[key]){

            e.preventDefault();

            setDirection(
                map[key]
            );

        }


        if(
            key===" "
        ){

            togglePause();

        }

    }
);


/* =========================
   BUTTON CONTROLS
========================= */

document
.querySelectorAll(
    ".control-btn"
)
.forEach(btn=>{

    btn.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            setDirection(
                btn.dataset.dir
            );

        }
    );

});


/* =========================
   SWIPE
========================= */

let touchStartX = 0;

let touchStartY = 0;


canvas.addEventListener(
    "pointerdown",
    e=>{

        touchStartX =
            e.clientX;

        touchStartY =
            e.clientY;

    }
);


canvas.addEventListener(
    "pointerup",
    e=>{

        const dx =
            e.clientX -
            touchStartX;

        const dy =
            e.clientY -
            touchStartY;


        if(
            Math.abs(dx) < 20 &&
            Math.abs(dy) < 20
        )
            return;


        if(
            Math.abs(dx) >
            Math.abs(dy)
        ){

            setDirection(

                dx>0
                ?"right"
                :"left"

            );

        }

        else{

            setDirection(

                dy>0
                ?"down"
                :"up"

            );

        }

    }
);


/* =========================
   GAME UPDATE
========================= */

function update(){

    direction =
        nextDirection;


    const head =
        {

            x:
                snake[0].x +
                direction.x,

            y:
                snake[0].y +
                direction.y

        };


    const cols =
        Math.floor(
            canvas.clientWidth /
            gridSize
        );

    const rows =
        Math.floor(
            canvas.clientHeight /
            gridSize
        );


    /* WALL COLLISION */

    if(

        head.x < 0 ||

        head.y < 0 ||

        head.x >= cols ||

        head.y >= rows

    ){

        endGame();

        return;

    }


    /* SELF COLLISION */

    if(

        snake.some(

            segment=>

            segment.x===head.x &&

            segment.y===head.y

        )

    ){

        endGame();

        return;

    }


    snake.unshift(head);


    /* FOOD */

    if(

        head.x === food.x &&

        head.y === food.y

    ){

        score++;

        currentSpeed =
            Math.min(
                baseSpeed +
                Math.floor(score/3),
                20
            );

        createParticles(
            food.x,
            food.y
        );

        eatSound();

        vibrate(25);

        spawnFood();

    }

    else{

        snake.pop();

    }


    updateUI();

}


/* =========================
   DRAW
========================= */

function draw(time){

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* BOARD GRID */

    ctx.strokeStyle =
        "rgba(57,255,136,.035)";

    ctx.lineWidth = 1;


    for(
        let x=0;
        x<width;
        x+=gridSize
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x,
            height
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<height;
        y+=gridSize
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    /* FOOD */

    const pulse =
        1 +
        Math.sin(time*.008)*.12;

    const age =
        Math.min(
            1,
            (time-food.spawnTime)/250
        );

    const pop =
        Math.sin(
            age*Math.PI/2
        );


    ctx.save();

    ctx.translate(

        food.x*gridSize +
        gridSize/2,

        food.y*gridSize +
        gridSize/2

    );

    ctx.scale(
        pulse*pop,
        pulse*pop
    );

    ctx.shadowBlur = 25;

    ctx.shadowColor =
        "#ff3f81";

    ctx.fillStyle =
        "#ff3f81";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        gridSize*.32,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();


    /* SNAKE */

    snake.forEach(
        (segment,index)=>{

            const x =
                segment.x*
                gridSize;

            const y =
                segment.y*
                gridSize;


            const gradient =
                ctx.createLinearGradient(

                    x,
                    y,

                    x+gridSize,
                    y+gridSize

                );


            if(index===0){

                gradient.addColorStop(
                    0,
                    "#d9ffe8"
                );

                gradient.addColorStop(
                    1,
                    "#39ff88"
                );

            }

            else{

                gradient.addColorStop(
                    0,
                    "#39ff88"
                );

                gradient.addColorStop(
                    1,
                    "#00a94f"
                );

            }


            ctx.fillStyle =
                gradient;

            ctx.shadowBlur =
                index===0
                ?20
                :12;

            ctx.shadowColor =
                "#39ff88";


            roundRect(

                ctx,

                x+2,

                y+2,

                gridSize-4,

                gridSize-4,

                6

            );

            ctx.fill();

        }
    );


    ctx.shadowBlur = 0;


    drawParticles();

}


/* =========================
   ROUND RECT
========================= */

function roundRect(
    ctx,
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        w,
        h,
        r
    );

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time){

    if(!running)
        return;


    const delta =
        time-lastTime;

    lastTime = time;


    if(!paused){

        accumulator +=
            delta;


        const interval =
            1000/
            currentSpeed;


        while(
            accumulator >=
            interval
        ){

            update();

            accumulator -=
                interval;

        }

    }


    updateParticles();

    draw(time);


    /* FPS */

    fpsFrames++;

    fpsTime += delta;


    if(fpsTime>=500){

        fps =
            Math.round(
                fpsFrames*
                1000/
                fpsTime
            );

        fpsEl.textContent =
            fps;

        fpsFrames=0;

        fpsTime=0;

    }


    if(running){

        requestAnimationFrame(
            gameLoop
        );

    }

}


/* =========================
   GAME OVER
========================= */

function endGame(){

    running = false;

    gameOver = true;

    gameOverSound();

    vibrate(100);


    finalScoreEl.textContent =
        score;


    if(score>bestScore){

        bestScore = score;

        localStorage.setItem(

            "neonSnakeBest",

            bestScore

        );

    }


    bestEl.textContent =
        bestScore;


    setTimeout(()=>{

        gameOverEl
        .classList
        .add("show");

    },200);

}


/* =========================
   UI
========================= */

function updateUI(){

    scoreEl.textContent =
        score;

    bestEl.textContent =
        bestScore;

    speedEl.textContent =
        currentSpeed;

}


/* =========================
   PAUSE
========================= */

function togglePause(){

    if(
        !running ||
        gameOver
    )
        return;


    paused =
        !paused;


    pauseBtn.textContent =
        paused
        ?"▶"
        :"❚❚";


    clickSound();

}


pauseBtn.addEventListener(
    "click",
    togglePause
);


/* =========================
   RESTART
========================= */

restartBtn.addEventListener(
    "click",
    ()=>{

        clickSound();

        resetGame();

    }
);


/* =========================
   SETTINGS
========================= */

settingsBtn.addEventListener(
    "click",
    ()=>{

        settings.classList.toggle(
            "show"
        );

        clickSound();

    }
);


difficultyEl.addEventListener(
    "change",
    ()=>{

        baseSpeed =
            difficulties[
                difficultyEl.value
            ];

        speedSetting.value =
            baseSpeed;

        currentSpeed =
            baseSpeed;

        updateUI();

    }
);


speedSetting.addEventListener(
    "input",
    ()=>{

        baseSpeed =
            Number(
                speedSetting.value
            );

        currentSpeed =
            baseSpeed;

        updateUI();

    }
);


/* =========================
   PREVENT SCROLL
========================= */

document.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

    },
    {
        passive:false
    }
);


/* =========================
   BACKGROUND PARTICLES
========================= */

const bg =
    document.querySelector(
        ".background"
    );


for(
    let i=0;
    i<18;
    i++
){

    const p =
        document.createElement(
            "div"
        );

    p.className =
        "particle-bg";


    p.style.left =
        Math.random()*100+
        "%";


    p.style.animationDelay =
        Math.random()*8+
        "s";


    p.style.animationDuration =
        5+
        Math.random()*8+
        "s";


    bg.appendChild(p);

}


/* =========================
   INITIALIZE
========================= */

bestEl.textContent =
    bestScore;

baseSpeed =
    Number(
        speedSetting.value
    );

resizeCanvas();

resetGame();

</script>
